[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datastudy"
version = "0.1.0"
description = "DataStudy — copiloto inteligente de estudos"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "streamlit>=1.32",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
